# Duas coisas saem daqui: a doc em GitLab Pages (a cada push na branch padrão) e
# a release com os instaladores (a cada tag `v*`).
#
# Node 22, e não `lts`: é o que site/package.json exige (>=22.12), e `lts` troca
# de major sozinho.
image: node:22

# A ordem importa: a página de download resolve os assets da release em tempo de
# build. Publicar o site ANTES da release existir imprimiria "ainda não
# publicado" para a versão que acabou de sair.
stages:
  - build
  - release
  - deploy

# ---------------------------------------------------------------- instaladores

# Base dos três empacotamentos. A imagem oficial do electron-builder traz wine e
# nsis, que o Windows exige (`signAndEditExecutable: true` no
# electron-builder.yml grava ícone e metadados dentro do .exe), e fakeroot, que o
# .deb exige. É a mesma imagem que scripts/pack-win-docker.mjs já usa em máquina
# local — nada novo sendo estreado no CI.
.empacota:
  stage: build
  image: electronuserland/builder:wine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    # Dentro do projeto para o cache do GitLab alcançar: o padrão fica em ~/.cache,
    # que morre com o contêiner, e baixar o Electron inteiro a cada job é minuto
    # de runner jogado fora.
    #
    # ABSOLUTO, e não relativo: ao descompactar o fpm, o electron-builder roda o
    # 7za com o cwd JÁ dentro do diretório de cache e passa o mesmo caminho de
    # novo. Relativo, isso vira `.cache/.../fpm/.cache/.../fpm/x.7z`, e o job
    # morre com "No more files" — que não se parece nem um pouco com a causa.
    ELECTRON_CACHE: $CI_PROJECT_DIR/.cache/electron
    ELECTRON_BUILDER_CACHE: $CI_PROJECT_DIR/.cache/electron-builder
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .cache/
  before_script:
    - npm ci
    - npm run typecheck
    # Não se publica release que não passa no smoke — mesma regra do GitHub.
    - npm run test:smoke
    - npx electron-vite build
  artifacts:
    # Só os instaláveis: `dist/*-unpacked` é enorme e não se distribui, e o
    # `.blockmap` só serve para updater diferencial, que este app não usa. Cada
    # job casa apenas com os próprios formatos; os outros padrões ficam vazios.
    paths:
      - dist/*.AppImage
      - dist/*.deb
      - dist/*.exe
      - dist/*.dmg
      - dist/*.zip
    expire_in: 1 day

package:linux:
  extends: .empacota
  script:
    - npx electron-builder --linux --publish never

package:windows:
  extends: .empacota
  script:
    - npx electron-builder --win --publish never

# macOS é o único que NÃO sai de um contêiner Linux: o .dmg precisa do `hdiutil`,
# e node-pty é módulo nativo que teria de ser compilado para darwin. Exige um
# runner macOS registrado na instância.
#
# Por isso o job é opcional em dois níveis: a variável `MACOS_RUNNER` (defina
# como "true" nas variáveis do projeto quando o runner existir) e a tag `macos`,
# que escolhe a máquina. Sem a variável ele nem entra no pipeline — um job sem
# runner ficaria pendente até o timeout e seguraria a release atrás dele.
package:mac:
  extends: .empacota
  image: null
  tags:
    - macos
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $MACOS_RUNNER == "true"
  script:
    - npx electron-builder --mac --publish never

publish:release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - package:linux
    - package:windows
    # `optional`: sem runner macOS o job acima não existe, e a release sai com o
    # que foi empacotado em vez de falhar.
    - job: package:mac
      optional: true
  variables:
    # As notas saem do `git log` desde a tag anterior, e o clone raso padrão
    # (profundidade 20) frequentemente não alcança essa tag.
    GIT_DEPTH: 0
  script:
    - node scripts/gitlab-release.mjs

# ------------------------------------------------------------------ documentação

create-pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Também na tag, e depois da release por causa das etapas: é o que faz a
    # versão nova aparecer na página de download.
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - cd site
  script:
    - npm ci
    # O astro.config.mjs aponta para o GitHub Pages (br3nds0n.github.io/atelier)
    # e aqui a URL é outra. Um `base` errado não degrada: quebra todo link
    # interno e todo asset de uma vez, e a página sobe sem CSS. As flags
    # sobrescrevem o config sem tocar no arquivo, e `CI_PAGES_URL` é a URL final
    # deste site, dada pelo próprio GitLab.
    - ORIGIN=$(node -p 'new URL(process.env.CI_PAGES_URL).origin')
    - BASE=$(node -p 'new URL(process.env.CI_PAGES_URL).pathname')
    - npm run build -- --site "$ORIGIN" --base "$BASE"
  pages:
    # `site/dist`, e não `site`: é onde o Astro gera. Publicar `site` sobe o
    # CÓDIGO-FONTE da doc, sem nenhum index.html servível.
    publish: site/dist
