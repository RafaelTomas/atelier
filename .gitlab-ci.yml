# Duas coisas saem daqui: a doc em GitLab Pages (a cada push na branch padrão) e
# a release com os instaladores (a cada tag `v*`).
#
# Node 22, e não `lts`: é o que site/package.json exige (>=22.12), e `lts` troca
# de major sozinho.
image: node:22

# A ordem importa: a página de download resolve os assets da release em tempo de
# build. Publicar o site ANTES da release existir imprimiria "ainda não
# publicado" para a versão que acabou de sair.
stages:
  - build
  - release
  - deploy

# ---------------------------------------------------------------- instaladores

# Só Linux, e não é escolha: node-pty é módulo nativo, não cross-compila, e um
# .dmg ou .exe exige runner macOS e Windows. Enquanto a instância só tiver
# runners Docker/Linux, os outros dois sistemas continuam saindo pelo GitHub
# Actions (.github/workflows/release.yml), que tem a matriz das três máquinas.
package:linux:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    # O empacotamento .deb chama `fakeroot`, que não vem na imagem do Node. O
    # resto (appimagetool, 7za) o electron-builder baixa para o cache dele.
    - apt-get update && apt-get install -y --no-install-recommends fakeroot
  script:
    - npm ci
    - npm run typecheck
    # Não se publica release que não passa no smoke — mesma regra do GitHub.
    - npm run test:smoke
    - npx electron-vite build
    - npx electron-builder --linux --publish never
  artifacts:
    # Só os instaláveis: `dist/linux-unpacked` é enorme e não se distribui.
    paths:
      - dist/*.AppImage
      - dist/*.deb
      - dist/*.zip
    expire_in: 1 day

publish:release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - package:linux
  variables:
    # As notas saem do `git log` desde a tag anterior, e o clone raso padrão
    # (profundidade 20) frequentemente não alcança essa tag.
    GIT_DEPTH: 0
  script:
    - node scripts/gitlab-release.mjs

# ------------------------------------------------------------------ documentação

create-pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Também na tag, e depois da release por causa das etapas: é o que faz a
    # versão nova aparecer na página de download.
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - cd site
  script:
    - npm ci
    # O astro.config.mjs aponta para o GitHub Pages (br3nds0n.github.io/atelier)
    # e aqui a URL é outra. Um `base` errado não degrada: quebra todo link
    # interno e todo asset de uma vez, e a página sobe sem CSS. As flags
    # sobrescrevem o config sem tocar no arquivo, e `CI_PAGES_URL` é a URL final
    # deste site, dada pelo próprio GitLab.
    - ORIGIN=$(node -p 'new URL(process.env.CI_PAGES_URL).origin')
    - BASE=$(node -p 'new URL(process.env.CI_PAGES_URL).pathname')
    - npm run build -- --site "$ORIGIN" --base "$BASE"
  pages:
    # `site/dist`, e não `site`: é onde o Astro gera. Publicar `site` sobe o
    # CÓDIGO-FONTE da doc, sem nenhum index.html servível.
    publish: site/dist
