appId: dev.atelier.app
productName: Atelier
copyright: GPL-3.0

directories:
  output: dist
  # build/icon.png (1024×1024) é a fonte: o electron-builder gera .icns e .ico
  # a partir dele. Quem desenha é build/icon.svg — ver scripts/make-icon.cjs.
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  # O CLI atelier precisa existir em disco para ser copiado ao bin do usuário
  - from: resources/atelier.cjs
    to: atelier.cjs

# node-pty é módulo nativo: recompilado por plataforma, nunca empacotado no asar
asarUnpack:
  - '**/node_modules/node-pty/**'

# Só zip, nos três sistemas.
#
# Nada de .dmg, .exe, .AppImage ou .deb: sem Developer ID da Apple e sem
# certificado OV/EV, um instalador só acrescenta um passo que o sistema vai
# bloquear de qualquer jeito. O zip é o mesmo app, com o mesmo aviso de
# segurança, e sem a cerimônia — descompacta e roda.
#
# O `artifactName` cita o sistema em TODOS eles, e não é cosmético: o padrão do
# alvo zip é `${name}-${version}.${ext}`, sem o sistema. Os três jobs subiriam
# `atelier-0.1.0.zip` para a mesma versão do Package Registry e um sobrescreveria
# o outro — a release sairia com três links para o mesmo binário.

mac:
  icon: build/icon.png
  target:
    - zip
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  category: public.app-category.developer-tools
  # Sem Developer ID a distribuição sai ad-hoc, igual ao app nativo hoje
  identity: null
  hardenedRuntime: false

win:
  icon: build/icon.png
  target:
    - zip
  artifactName: ${name}-${version}-win-${arch}.${ext}
  # Grava ícone e metadados DENTRO do Atelier.exe que vai no zip; exige wine fora
  # do Windows. Sem certificado OV/EV o SmartScreen bloqueia até ganhar reputação.
  signAndEditExecutable: true

linux:
  icon: build/icon.png
  target:
    - zip
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  category: Development

publish: null
