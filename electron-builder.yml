appId: dev.atelier.app
productName: Atelier
copyright: GPL-3.0

directories:
  output: dist
  # build/icon.png (1024×1024) é a fonte: o electron-builder gera .icns e .ico
  # a partir dele. Quem desenha é build/icon.svg — ver scripts/make-icon.cjs.
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  # O CLI atelier precisa existir em disco para ser copiado ao bin do usuário
  - from: resources/atelier.cjs
    to: atelier.cjs

# node-pty é módulo nativo: recompilado por plataforma, nunca empacotado no asar
asarUnpack:
  - '**/node_modules/node-pty/**'

mac:
  icon: build/icon.png
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # Sem Developer ID a distribuição sai ad-hoc, igual ao app nativo hoje
  identity: null
  hardenedRuntime: false

win:
  icon: build/icon.png
  target:
    # + zip portátil, sem instalador, para quem não quer/pode instalar
    - nsis
    - zip
  # Sem certificado OV/EV o SmartScreen bloqueia até ganhar reputação
  signAndEditExecutable: true

linux:
  icon: build/icon.png
  target:
    # + zip, alternativa sem AppImage/deb (ex.: distros que não suportam nenhum dos dois)
    - AppImage
    - deb
    - zip
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # O padrão é "${productName} Setup ${version}.${ext}", com espaços. O nome vai
  # para o Package Registry do GitLab, que só aceita [A-Za-z0-9._+-] e responde
  # 400 "file_name is invalid" — sem dizer qual caractere ofende.
  artifactName: ${name}-${version}-setup.${ext}

publish: null
